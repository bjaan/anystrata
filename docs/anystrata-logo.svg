  <title
     id="title">AnyStrata logo</title>
  <desc
     id="desc">Triangular layered logo with all elements fitting inside one outer triangle and a clear diagonal gap between the navy strata and the cyan facet.</desc>
  <g
     id="g5"
     transform="matrix(1,0,0,0.65499655,-1.2217038,31.418588)">
    <!-- Row 1: apex segment of the triangle -->
