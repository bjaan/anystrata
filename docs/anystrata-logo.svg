       fill="#1b2340"
       points="60.7,32 69,49 31,49 39.3,32 "
       id="polygon2"
       transform="matrix(1.0938692,0,0,1.0165696,-13.840765,-54.967357)" />
    <!-- Row 3 left navy stratum -->
    <polygon
       fill="#1b2340"
       points="53,54 47.6,70 20.7,70 28.5,54 "
       id="polygon3"
       transform="matrix(1.047601,0,0,1.0410789,-10.993648,-58.655047)" />
    <!-- Row 4 left navy stratum -->
    <polygon
       fill="#1b2340"
       points="40,92 10,92 18.3,75 45.7,75 "
       id="polygon4"
       transform="matrix(1.0292859,0,0,1.055232,-9.0711552,-61.518142)" />
    <!-- Cyan facet: also clipped to the same outer triangle, with a clear gap from the navy strata -->
    <polygon
       fill="#31a2f1"
       points="57,54 71.5,54 90,92 44,92 "
       id="polygon5"
       transform="translate(-9.3933004,-56.436789)" />
