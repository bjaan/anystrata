  <path d="M60 60 Q90 120 78 220 M540 90 Q512 150 522 240" stroke="url(#rim)" stroke-width="5" fill="none" opacity=".7"/>
  <text x="300" y="752" text-anchor="middle" fill="#c9d8ea" font-size="13" font-weight="bold">Strata Cyan — cute, but she documents the engine.</text>
