  <g transform="translate(190 700)">
    <circle cx="0" cy="0" r="6" fill="#31A2F1"/><circle cx="34" cy="8" r="6" fill="#1f6f9e"/><circle cx="70" cy="4" r="6" fill="#173a52"/>
