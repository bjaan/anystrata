  <text x="238" y="534" text-anchor="middle" fill="#31A2F1" font-size="13" font-weight="bold">391.</text>
  <text x="238" y="550" text-anchor="middle" fill="#5f7896" font-size="7">thinking → answer</text>
  <text x="238" y="564" text-anchor="middle" fill="#5f7896" font-size="7">19.0 tok/s · VRAM 100%</text>
